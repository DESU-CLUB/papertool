[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "papertool"
version = "0.1.0"
description = "Personal paper learning tool with MCP, graph view, Obsidian notes, and daily quizzes"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "PaperTool" }]
dependencies = [
  "typer>=0.12.3",
  "pydantic>=2.7.0",
  "tomli>=2.0.1; python_version < '3.11'",
  "pypdf>=4.2.0",
  "mcp>=1.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "maturin>=1.7.0",
]

[project.scripts]
papertool = "papertool.cli:app"
papertool-mcp = "papertool.mcp_server:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["papertool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not integration\""
markers = [
  "integration: tests that require external infrastructure",
]

[tool.maturin]
manifest-path = "rust/papertool_retriever/Cargo.toml"
module-name = "papertool_retriever_native"
