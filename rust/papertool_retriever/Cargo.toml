[package]
name = "papertool_retriever"
version = "0.1.0"
edition = "2021"

[lib]
name = "papertool_retriever_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }
tantivy = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
