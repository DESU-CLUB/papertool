name: VibeCommit

on:
  push:
    branches:
      - '**'

jobs:
  gate:
    uses: YOUR_ORG/vibecommit-hook/.github/workflows/vibecommit-gate.yml@main
    with:
      before_sha: ${{ github.event.before }}
      after_sha: ${{ github.sha }}
    secrets:
      VIBECOMMIT_HMAC_KEY: ${{ secrets.VIBECOMMIT_HMAC_KEY }}
